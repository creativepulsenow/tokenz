name: Release

# Pushing a version tag builds the DMG here, from the tagged commit, and
# publishes it with a signed provenance record. Running the workflow by hand
# does a dry run: it builds and checks the DMG and keeps it as a workflow
# artifact, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the project's own code (tests, build script) with a read-only token.
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.dmg.outputs.version }}
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main and matches the app version
        if: github.event_name == 'push'
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

      - name: Run unit tests
        run: xcodebuild -project Tokenz.xcodeproj -scheme Tokenz -derivedDataPath build/test-derived test

      - name: Build and check the DMG
        id: dmg
        run: |
          ./Scripts/make-dmg.sh
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          file="build/Tokenz-${version}.dmg"
          test -f "$file"
          mkdir -p release
          cp "$file" release/
          {
            echo "version=${version}"
            echo "sha256=$(shasum -a 256 "$file" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          # The section of CHANGELOG.md for this version.
          awk -v v="## ${VERSION}" '$0 == v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes-body.md
          if ! grep -q '[^[:space:]]' notes-body.md; then
            echo "CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          {
            echo "Usage limits for Claude Code in your menu bar."
            echo
            echo "## New in ${VERSION}"
            cat notes-body.md
            echo
            echo "## Install"
            echo
            echo "1. Download \`Tokenz-${VERSION}.dmg\` and drag the app to Applications."
            echo "2. Open it. The app is ad-hoc signed and not notarized yet, so the first time go to **System Settings → Privacy & Security** and click **Open Anyway**."
            echo "3. Click the menu bar item, then **Connect to Claude Code**."
            echo "4. Send a message in Claude Code."
            echo
            echo "Requires a Mac with Apple Silicon, macOS 14 or later, Claude Code, and a Claude Pro or Max plan."
            echo
            echo "## Verify the download"
            echo
            echo "This DMG was built by GitHub Actions from the tagged commit. To check that:"
            echo
            echo '```'
            echo "gh attestation verify Tokenz-${VERSION}.dmg -R ${GITHUB_REPOSITORY} \\"
            echo "  --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml \\"
            echo "  --source-ref refs/tags/v${VERSION}"
            echo '```'
            echo
            echo "SHA-256: \`${SHA256}\`"
          } > release/notes.md
          cat release/notes.md

      - name: Hand the DMG and notes to the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tokenz-${{ steps.dmg.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Holds the write permissions, and runs none of the project's own code:
  # it only signs and publishes what the build job produced.
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance record
      attestations: write   # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tokenz-${{ needs.build.outputs.version }}
          path: release

      - name: Check the DMG is the one that was built
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${SHA256}  release/Tokenz-${VERSION}.dmg" | shasum -a 256 -c -

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Tokenz-${{ needs.build.outputs.version }}.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "release/Tokenz-${VERSION}.dmg" --title "Tokenz ${VERSION}" --notes-file release/notes.md --verify-tag
