# XcodeGen project specification
# Install xcodegen: brew install xcodegen
# Generate project: xcodegen generate
# Then open: open Tokenz.xcodeproj

name: Tokenz
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Apple Silicon only. Intel Macs are not supported.
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    # Keep the build machine's paths out of binaries: record source paths
    # relative to the repo.
    OTHER_SWIFT_FLAGS: "$(inherited) -file-prefix-map $(SRCROOT)=."

targets:
  Tokenz:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tokenz
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Tokenz
        PRODUCT_BUNDLE_IDENTIFIER: com.creativepulsenow.tokenz
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_APP_SANDBOX: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Shipped builds use the hardened runtime and carry no debug
          # entitlement (get-task-allow), so other processes can't attach to
          # the app. Debug builds keep the default so Xcode can debug them.
          ENABLE_HARDENED_RUNTIME: true
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
          # Strip local symbols and debug stabs. They carry absolute
          # object-file paths, and with them the user name.
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: non-global
          COPY_PHASE_STRIP: true

  # Unit tests for the pure logic. Hostless: the files under test are
  # compiled straight into the bundle, so running the tests never launches
  # the menu bar app or touches real settings.
  TokenzTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TokenzTests
      - path: Sources/Tokenz/AppPaths.swift
      - path: Sources/Tokenz/SettingsEditor.swift
      - path: Sources/Tokenz/ClaudeCodeConnection.swift
      - path: Sources/Tokenz/UsageMerge.swift
      - path: Sources/Tokenz/ModelUsage.swift
      - path: Sources/Tokenz/AlertRules.swift
      - path: Sources/Tokenz/UsageFormat.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creativepulsenow.tokenz.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Tokenz:
    build:
      targets:
        Tokenz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TokenzTests
