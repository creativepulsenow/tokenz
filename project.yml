# XcodeGen project specification
# Install xcodegen: brew install xcodegen
# Generate project: xcodegen generate
# Then open: open Tokenz.xcodeproj

name: Tokenz
options:
  bundleIdPrefix: com.creativepulsenow
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Apple Silicon only. Intel Macs are not supported.
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    PRODUCT_BUNDLE_IDENTIFIER: com.creativepulsenow.tokenz
    INFOPLIST_FILE: Resources/Info.plist
    PRODUCT_NAME: Tokenz

targets:
  Tokenz:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tokenz
        type: group
      - path: Resources/Assets.xcassets
    resources:
      - path: Resources/Info.plist
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: false
        # Hardened runtime on, and no debug entitlement (get-task-allow) in
        # shipped builds: other processes must not be able to attach to the app.
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keep the build machine's paths out of the binary: record source
        # paths relative to the repo.
        OTHER_SWIFT_FLAGS: "$(inherited) -file-prefix-map $(SRCROOT)=."
      configs:
        Release:
          # Strip local symbols and debug stabs from shipped builds. They
          # carry absolute object-file paths, and with them the user name.
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: non-global
          COPY_PHASE_STRIP: true
